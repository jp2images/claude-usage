name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The csproj targets plain net8.0 and handles OS differences at runtime, so
  # the matrix is what actually holds that claim honest.
  avalonia:
    name: Avalonia (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't hide the state of the other two.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        working-directory: ./avalonia
        run: dotnet build ClaudeUsage.sln --configuration Release

      - name: Test
        working-directory: ./avalonia
        run: dotnet test ClaudeUsage.sln --configuration Release --no-build

  swiftui:
    name: SwiftUI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: ./swiftui/ClaudeUsage
        run: swift build --build-tests

      - name: Test
        working-directory: ./swiftui/ClaudeUsage
        run: swift test
